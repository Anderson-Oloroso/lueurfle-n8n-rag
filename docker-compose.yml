services:
  n8n:
    image: n8nio/n8n:latest
    container_name: lueurfle-n8n
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_HOST=${NGROK_DOMAIN:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=${N8N_WEBHOOK_URL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Guatemala}
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/opt/lueurfle/workflows:ro
    networks:
      - lueurfle-n8n-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  ngrok:
    image: ngrok/ngrok:latest
    container_name: lueurfle-ngrok
    env_file:
      - .env
    command:
      - "http"
      - "--url=${NGROK_DOMAIN}"
      - "n8n:5678"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      n8n:
        condition: service_healthy
    networks:
      - lueurfle-n8n-net
    restart: unless-stopped

volumes:
  n8n_data:

networks:
  lueurfle-n8n-net: